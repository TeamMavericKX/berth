<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>berth · console</title>
<style>
:root {
  --wall:#0a0b0d; --surface:#101113; --content:#131416; --inset:#0a0b0d;
  --line:rgba(255,255,255,.05); --ring:rgba(255,255,255,.09); --line3:rgba(255,255,255,.14);
  --fg:#f7f8f8; --muted:#8a8f98; --dim:#5f6771;
  --accent:#e0231c; --ember:#ff5a3c;
  --live:#34d399; --danger:#f87171;
  --tint:rgba(255,255,255,.03); --hover:rgba(255,255,255,.05);
  --r-xs:4px; --r-sm:5px; --r-md:7px; --r-lg:9px;
  --ease:cubic-bezier(.22,.61,.36,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --shadow-pop:
    0 2.8px 2.2px rgba(0,0,0,.20), 0 6.7px 5.3px rgba(0,0,0,.24),
    0 12.5px 10px rgba(0,0,0,.26), 0 22.3px 17.9px rgba(0,0,0,.28),
    0 41.8px 33.4px rgba(0,0,0,.30), 0 100px 80px rgba(0,0,0,.34);
}
@media (prefers-color-scheme: light) {
  :root {
    --wall:#ececeb; --surface:#f3f3f2; --content:#f7f7f6; --inset:#ececeb;
    --line:rgba(28,28,26,.07); --ring:rgba(28,28,26,.13); --line3:rgba(28,28,26,.24);
    --fg:#121211; --muted:#5c5c5a; --dim:#98968e;
    --accent:#c21d17; --ember:#a01a15;
    --live:#0e9f6e; --danger:#d64545;
    --tint:rgba(28,28,26,.035); --hover:rgba(28,28,26,.05);
    --shadow-pop:
      0 2.8px 2.2px rgba(28,28,26,.06), 0 6.7px 5.3px rgba(28,28,26,.08),
      0 12.5px 10px rgba(28,28,26,.10), 0 22.3px 17.9px rgba(28,28,26,.11),
      0 41.8px 33.4px rgba(28,28,26,.13), 0 100px 80px rgba(28,28,26,.16);
  }
}
* { box-sizing:border-box; margin:0; padding:0; }
html { color-scheme:dark light; }
body {
  font:12px/1.6 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--fg); background:var(--wall); min-height:100vh;
}
::selection { background:rgba(224,35,28,.35); }
:focus-visible { outline:2px solid rgba(224,35,28,.68); outline-offset:2px; border-radius:var(--r-xs); }
.wrap { max-width:1064px; margin:0 auto; padding:0 20px 80px; }

header.bar {
  position:sticky; top:16px; z-index:50;
  display:flex; align-items:center; gap:14px;
  padding:10px 18px; margin:16px auto 20px; max-width:1064px;
  background:color-mix(in srgb,var(--wall) 82%,transparent);
  background:var(--wall);
  border:.5px solid var(--line3); border-radius:var(--r-lg);
  box-shadow:0 18px 44px rgba(0,0,0,.28);
}
@supports (backdrop-filter:saturate(140%) blur(12px)) {
  header.bar { background:rgba(10,11,13,.78); backdrop-filter:saturate(140%) blur(12px); -webkit-backdrop-filter:saturate(140%) blur(12px); }
}
@media (prefers-color-scheme: light){
  header.bar{ box-shadow:0 18px 44px rgba(28,28,26,.10); }
  @supports (backdrop-filter:saturate(140%) blur(12px)){
    header.bar{ background:rgba(243,243,242,.82); }
  }
}
.mark { display:flex; align-items:center; gap:9px; font-weight:700; letter-spacing:-.01em; font-size:13px; }
.mark i {
  width:10px; height:10px; border-radius:2px; display:inline-block;
  background:var(--accent); box-shadow:0 0 10px rgba(224,35,28,.45);
}
.pill {
  display:inline-flex; align-items:center; gap:7px;
  font-size:11px; line-height:18px; min-height:24px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); border:.5px solid var(--line3); border-radius:var(--r-sm);
  background:var(--inset); padding:2px 9px;
}
.pill .dot { width:7px; height:7px; border-radius:50%; background:var(--danger); }
.pill.on { color:var(--live); }
.pill.on .dot { background:var(--live); animation:pulse 2s var(--ease) infinite; }
@keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)} 70%{box-shadow:0 0 0 7px transparent} 100%{box-shadow:0 0 0 0 transparent} }

#search {
  margin-left:auto; width:min(260px,38vw); height:36px;
  background:var(--inset); border:.5px solid var(--ring); border-radius:var(--r-sm);
  color:var(--fg); font:inherit; font-size:12px; padding:0 12px; outline:none;
  transition:border-color .15s var(--ease), color .15s var(--ease);
}
#search:hover { border-color:var(--line3); }
#search:focus { border-color:rgba(224,35,28,.55); outline:none; }
#search::placeholder { color:var(--dim); }

.stats {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px;
}
.stat {
  background:var(--surface); border:.5px solid var(--ring); border-radius:var(--r-md);
  padding:13px 16px;
}
.stat b { display:block; font-size:22px; letter-spacing:-.02em; font-weight:400; }
.stat span { font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
.stat.t b { color:var(--accent); } .stat.g b { color:var(--live); }
.stat.c b, .stat.v b { color:var(--fg); }

.panel {
  background:var(--surface); border:.5px solid var(--ring); border-radius:var(--r-md);
  overflow:hidden;
}
table { width:100%; border-collapse:collapse; }
th,td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
thead th {
  font-size:10.5px; font-weight:400; text-transform:uppercase; letter-spacing:.1em;
  color:var(--muted); background:var(--content);
}
tbody tr { transition:background .15s var(--ease); }
tbody tr:hover { background:var(--tint); }
tbody tr:last-child td { border-bottom:none; }
tr.down td { opacity:.42; }

.st { width:26px; }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:var(--dim); }
.dot.live { background:var(--live); box-shadow:0 0 8px rgba(52,211,153,.55); animation:pulse 2.4s var(--ease) infinite; }
.portchip {
  font-family:inherit; font-size:12px; line-height:18px;
  background:var(--inset); border:.5px solid var(--ring);
  border-radius:var(--r-sm); padding:2px 8px;
}
.nm { font-weight:700; }
.nm a { color:inherit; text-decoration:none; border-bottom:1px dotted var(--line3); transition:color .15s var(--ease); }
.nm a:hover { color:var(--ember); border-color:var(--ember); }
.nm .none { color:var(--dim); font-weight:400; }
.tag {
  display:inline-flex; align-items:center; min-height:24px; padding:2px 7px; border-radius:calc(var(--r-sm) * 1.25);
  font-family:inherit; font-size:11px; line-height:18px; font-weight:400;
  border:.5px solid var(--line3); color:var(--muted); background:var(--inset);
}
.badge {
  display:inline-flex; align-items:center; gap:6px; min-height:24px; padding:2px 8px; border-radius:calc(var(--r-sm) * 1.25);
  font-size:11px; line-height:18px; border:.5px solid var(--line3); color:var(--muted); background:var(--inset);
}
.badge::before { content:""; width:6px; height:6px; border-radius:1.5px; background:var(--dim); }
.badge.registered { color:var(--fg); } .badge.registered::before{ background:var(--accent); }
.badge.container  { color:var(--fg); } .badge.container::before { background:var(--ember); }
.badge.catalog    { color:var(--fg); } .badge.catalog::before   { background:#c9a24a; }
.tunnelchip {
  font-family:inherit; font-size:11px; line-height:18px;
  color:var(--ember); border:.5px solid rgba(224,35,28,.4); border-radius:calc(var(--r-sm) * 1.25);
  padding:2px 8px; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  display:inline-block; vertical-align:middle;
}
.pidcell { color:var(--muted); font-family:inherit; font-size:12px; }

.acts { white-space:nowrap; text-align:right; opacity:0; transition:opacity .15s var(--ease); }
tr:hover .acts { opacity:1; }
@media (hover:none){ .acts{ opacity:1; } }
.acts button {
  border:.5px solid var(--line3); background:transparent; color:var(--muted);
  font:inherit; font-size:11px; line-height:18px; border-radius:var(--r-sm);
  padding:3px 9px; cursor:pointer; margin-left:5px;
  transition:color .15s var(--ease), background .15s var(--ease), border-color .15s var(--ease);
}
.acts button:hover { color:var(--fg); background:var(--hover); }
.acts button.kill:hover { color:var(--accent); border-color:rgba(224,35,28,.55); background:rgba(224,35,28,.09); }

.empty { text-align:center; padding:64px 20px; color:var(--muted); }
.empty .glyph {
  font-size:40px; line-height:1; display:block; margin-bottom:14px; color:var(--accent);
}
.empty code {
  font-size:12px; background:var(--inset); border:.5px solid var(--ring);
  border-radius:var(--r-sm); padding:3px 9px; color:var(--fg);
}

#menu {
  position:fixed; display:none; z-index:60; min-width:190px;
  background:var(--content); border:.5px solid var(--line3); border-radius:var(--r-md);
  box-shadow:var(--shadow-pop); padding:5px;
}
#menu button {
  display:flex; width:100%; gap:8px; align-items:center;
  text-align:left; padding:6px 10px; border:none; background:none;
  font:inherit; font-size:12px; color:var(--fg); cursor:pointer; border-radius:var(--r-sm);
  transition:background .12s var(--ease);
}
#menu button:hover { background:var(--hover); }
#menu button.danger { color:var(--danger); }

#toasts { position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:9px; z-index:70; }
.toast {
  background:var(--content); border:.5px solid var(--line3); border-left:2px solid var(--accent);
  color:var(--fg); font-size:12px; padding:9px 14px; border-radius:var(--r-md);
  box-shadow:var(--shadow-pop);
  opacity:0; transform:translateY(8px); transition:all .25s var(--ease-out);
  max-width:340px; overflow-wrap:anywhere;
}
.toast.show { opacity:1; transform:none; }
.toast.err { border-left-color:var(--danger); }

footer.foot { margin-top:18px; text-align:center; font-size:11px; letter-spacing:.04em; color:var(--dim); }
footer.foot a { color:var(--muted); text-decoration:none; border-bottom:1px dotted var(--line3); }
footer.foot a:hover { color:var(--ember); }

@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
@media (max-width:720px){
  .hide-sm { display:none; }
  header.bar { flex-wrap:wrap; }
  #search { width:100%; order:3; margin-left:0; }
}
</style>
</head>
<body>

<header class="bar wrap">
  <span class="mark"><i></i>berth</span>
  <span class="pill" id="live"><span class="dot"></span><span id="livetxt">connecting</span></span>
  <input id="search" type="search" placeholder="filter name / port / origin…" autocomplete="off" spellcheck="false">
</header>

<div class="wrap">
  <div class="stats">
    <div class="stat t"><b id="s-total">–</b><span>ports seen</span></div>
    <div class="stat g"><b id="s-live">–</b><span>live</span></div>
    <div class="stat c"><b id="s-cont">–</b><span>containers</span></div>
    <div class="stat v"><b id="s-tun">–</b><span>tunneled</span></div>
  </div>

  <div class="panel">
    <table id="tbl">
      <thead><tr>
        <th class="st"></th><th>port</th><th>name</th><th class="hide-sm">category</th>
        <th>origin</th><th class="hide-sm">tunnel</th><th class="hide-sm">pid</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">
      <span class="glyph">◇</span>
      nothing on loopback yet<br><br>
      <code>berth run -- npm run dev</code>
    </div>
  </div>

  <footer class="foot">loopback only · mutations gated by origin + token · <a href="/markdown">markdown view</a></footer>
</div>

<div id="menu"></div>
<div id="toasts"></div>

<script>
const rows = document.getElementById('rows');
const empty = document.getElementById('empty');
const menu = document.getElementById('menu');
const search = document.getElementById('search');
let current = [];
let query = '';

function toast(msg, err) {
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : ''); el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2800);
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function matches(e) {
  if (!query) return true;
  const hay = `${e.name||''} ${e.port} ${e.category||''} ${e.origin} ${e.tunnel||''}`.toLowerCase();
  return hay.includes(query);
}

function render(data) {
  current = data;
  const entries = (data.entries || []).filter(matches);

  document.getElementById('s-total').textContent = (data.entries || []).length;
  document.getElementById('s-live').textContent = (data.entries || []).filter(e => e.alive).length;
  document.getElementById('s-cont').textContent = (data.entries || []).filter(e => e.origin === 'container').length;
  document.getElementById('s-tun').textContent = (data.entries || []).filter(e => e.tunnel).length;

  rows.innerHTML = '';
  empty.style.display = entries.length ? 'none' : 'block';

  const tags = data.tags || {};
  for (const e of entries) {
    const tr = document.createElement('tr');
    if (!e.alive) tr.className = 'down';

    const status = `<span class="dot ${e.alive ? 'live' : ''}" title="${e.alive?'live':'down'}"></span>`;
    const nameCell = e.name
      ? `<span class="nm"><a href="http://${esc(e.name)}.localhost:${e.port}/">${esc(e.name)}</a></span>`
      : '<span class="nm none">—</span>';
    const cat = e.category || 'other';
    const color = tags[cat];
    const tagStyle = color ? ` style="border-color:${esc(color)};color:${esc(color)}"` : '';
    const tunnel = e.tunnel ? `<span class="tunnelchip" title="${esc(e.tunnel)}">${esc(e.tunnel)}</span>` : '<span style="color:var(--dim)">—</span>';

    tr.innerHTML =
      `<td class="st">${status}</td>` +
      `<td><span class="portchip">${e.port}</span></td>` +
      `<td>${nameCell}</td>` +
      `<td class="hide-sm"><span class="tag"${tagStyle}>${esc(cat)}</span></td>` +
      `<td><span class="badge ${esc(e.origin)}">${esc(e.origin)}</span></td>` +
      `<td class="hide-sm">${tunnel}</td>` +
      `<td class="hide-sm pidcell">${e.pid ?? ''}</td>` +
      `<td class="acts">` +
        `<button data-a="edit" title="rename / recategorize">✎</button>` +
        `<button data-a="kill" class="kill" title="kill process">⏻</button>` +
      `</td>`;
    tr.dataset.port = e.port; tr.dataset.name = e.name || ''; tr.dataset.category = cat;
    tr.querySelector('[data-a="edit"]').onclick = ev => { ev.stopPropagation(); editEntry(e); };
    tr.querySelector('[data-a="kill"]').onclick = ev => { ev.stopPropagation(); killEntry(e); };
    tr.addEventListener('contextmenu', ev => { ev.preventDefault(); openMenu(ev, e); });
    rows.appendChild(tr);
  }
}

async function killEntry(e) {
  if (!confirm(`Kill the process on port ${e.port}?`)) return;
  try {
    const res = await fetch(`/api/kill?port=${e.port}`, { method: 'POST' });
    const txt = (await res.text()).trim();
    res.ok ? toast(`port ${e.port}: ${txt}`) : toast(`could not kill port ${e.port}`, true);
  } catch { toast(`could not kill port ${e.port}`, true); }
}

async function editEntry(e) {
  const name = prompt('Name', e.name || '');
  if (name === null) return;
  const category = prompt('Category', e.category || 'other') || 'other';
  try {
    const res = await fetch(`/api/edit?port=${e.port}&name=${encodeURIComponent(name)}&category=${encodeURIComponent(category)}`, { method: 'POST' });
    toast(res.ok ? `saved ${name}` : 'save failed', !res.ok);
  } catch { toast('save failed', true); }
}

function openMenu(ev, entry) {
  menu.innerHTML = '';
  const edit = document.createElement('button');
  edit.textContent = '✎  Edit name / category';
  edit.onclick = () => { closeMenu(); editEntry(entry); };
  const kill = document.createElement('button');
  kill.textContent = '⏻  Kill process';
  kill.className = 'danger';
  kill.onclick = () => { closeMenu(); killEntry(entry); };
  menu.append(edit, kill);
  menu.style.display = 'block';
  menu.style.left = Math.min(ev.clientX, innerWidth - 210) + 'px';
  menu.style.top = Math.min(ev.clientY, innerHeight - 110) + 'px';
}

function closeMenu() { menu.style.display = 'none'; }
addEventListener('click', closeMenu);
search.addEventListener('input', () => { query = search.value.trim().toLowerCase(); render(current); });

function setLive(on, txt) {
  document.getElementById('live').classList.toggle('on', on);
  document.getElementById('livetxt').textContent = txt;
}

const es = new EventSource('/events');
es.addEventListener('scan', ev => { setLive(true, 'live'); try { render(JSON.parse(ev.data)); } catch {} });
es.addEventListener('keepalive', () => setLive(true, 'live'));
es.onerror = () => { setLive(false, 'reconnecting'); es.close(); setTimeout(() => location.reload(), 2500); };

fetch('/api/ports').then(r => r.json()).then(d => { setLive(true, 'live'); render(d); }).catch(() => setLive(false, 'offline'));
</script>
</body>
</html>
