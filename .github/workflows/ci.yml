name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-linux
          - os: macos-latest
            triple: aarch64-macos
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.16.0
        run: |
          curl -fsSL --retry 5 --retry-delay 5 \
            "https://ziglang.org/download/0.16.0/zig-${{ matrix.triple }}-0.16.0.tar.xz" \
            -o /tmp/zig.tar.xz
          mkdir -p "$HOME/.zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig" --strip-components=1
          echo "$HOME/.zig" >> "$GITHUB_PATH"
      - name: Zig version
        run: zig version
      - name: Format check
        run: zig fmt --check src/
      - name: Build
        run: zig build
      - name: Test
        run: zig build test

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        triple: [x86_64-linux, aarch64-linux, x86_64-macos, aarch64-macos, x86_64-windows-gnu]
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.16.0
        run: |
          curl -fsSL --retry 5 --retry-delay 5 \
            "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz" \
            -o /tmp/zig.tar.xz
          mkdir -p "$HOME/.zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig" --strip-components=1
          echo "$HOME/.zig" >> "$GITHUB_PATH"
      - name: Build ReleaseSafe for ${{ matrix.triple }}
        run: zig build -Dtarget=${{ matrix.triple }} -Doptimize=ReleaseSafe
      - name: Smoke test artifact exists and runs where possible
        run: |
          file zig-out/bin/berth || true
          test -x zig-out/bin/berth
      - uses: actions/upload-artifact@v4
        with:
          name: berth-${{ matrix.triple }}
          path: zig-out/bin/

  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce six-word conventional commits
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha || github.push.before }}"
          HEAD="${{ github.sha }}"
          TYPES="feat|fix|docs|chore|refactor|test|ci|perf|build"
          FAIL=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            if ! echo "$subject" | grep -qE "^($TYPES)(\([a-z0-9-]+\))?: [a-z0-9]+( [a-z0-9]+){5}$"; then
              echo "BAD: $subject"
              FAIL=1
            fi
          done < <(git log --format='%s' "$BASE".."$HEAD")
          exit $FAIL
